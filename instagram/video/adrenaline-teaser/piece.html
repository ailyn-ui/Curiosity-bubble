<!doctype html>
<html><head><meta charset="utf-8"><title>Put the weight down</title>
<style>html,body{margin:0;background:#222}canvas{display:block;margin:0 auto;max-height:100vh;width:auto}</style>
</head><body><canvas id="cv"></canvas>
<script>
// "Put the weight down" — Ailyn Eida. 30 s, 9:16.
// Idea: your ideas swirl freely; an ink ensō draws itself around them and becomes their home;
// everything settles; a peony grows in the calm; a bird lands, then lifts off, light.
// Continuity device: the ensō (the container).

const W = 1080, H = 1920, FPS = 30, DUR = 30, NF = FPS * DUR;
const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const X = cv.getContext('2d', { willReadFrequently: true });

// ---------- palette ----------
const C_PAPER = '#FBFAF6', C_INK = '#0B0B0B', C_PINK = '#E6005C';

// ---------- timeline (seconds) ----------
const T = {
  ensoDraw: [7.0, 10.6],
  settle: [6.0, 12.8],
  // the ideas leave one by one; the butterfly stays
  depart: { swoosh: [6.0, 7.3], palm: [7.4, 8.7], monstera: [8.8, 10.1], cosmos: [10.2, 11.5], butterfly: [11.0, 12.8] },
  mountain: [12.4, 15.6],
  mist: [12.0, 30.0],
  peony: [18.4, 22.6],
  branch: [22.3, 23.2],
  birdIn: [22.7, 24.6],
  birdOut: [26.0, 28.8],
  flyAway: [26.4, 29.4],
  // k: big (bold capitals) / small (regular) / title (article title, in quotes). pink: the one key word.
  lines: [
    { t: [0.4, 4.1], items: [{ k: 'big', text: 'Your adrenaline is paying your bills.', pink: 'adrenaline' }] },
    { t: [4.5, 9.0], items: [{ k: 'small', text: 'Brilliant on the high days.' }, { k: 'small', text: 'A boulder on the next.', d: 0.9 }] },
    { t: [9.4, 13.3], items: [{ k: 'big', text: "There's a reason, and it lives in your body.", pink: 'body' }] },
    { t: [13.7, 19.3], items: [{ k: 'big', text: 'Your brain runs a body budget.' }, { k: 'small', text: 'Ask it for high energy every single day, and it starts protecting you.', pink: 'protecting', d: 1.2 }] },
    { t: [19.7, 25.1], items: [{ k: 'small', text: 'Your ideas. Your framework.', gap: 0 }, { k: 'small', text: 'Your track record.', d: 0.4 }, { k: 'big', text: 'Give them somewhere to live.', pink: 'live', d: 1.1 }, { k: 'small', text: 'Then rest.', d: 2.0 }] },
    { t: [25.5, 31], items: [{ k: 'big', text: 'Comment ADRENALINE', pink: 'ADRENALINE' }, { k: 'small', text: "and I'll send you the full article.", d: 0.8 }, { k: 'title', text: '“Your Adrenaline Is Paying Your Bills”', d: 1.5 }] },
  ],
};
window.T = T;

// ---------- layout ----------
const CX = 540, CY = 1150, R = 320;           // the ensō
const TEXT_X = 110, TEXT_Y = 270, TEXT_W = 760;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const hash = (a, b) => rng(a * 9301 + b * 49297 + 233)();

// ---------- assets ----------
const NAMES = ['swoosh','monstera','cosmos','butterfly','palm','strokes','flower','enso','mountain','cloud','peony','birdonly','branch'];
const IMG = {};
let PAPER, GRAIN = [];

function loadImg(n) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'el/' + n + '.png'; }); }

function makePaper() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = C_PAPER; g.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 40; i++) {               // soft mottling
    const x = r() * W, y = r() * H, rad = 80 + r() * 260;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${r() < .5 ? '150,135,120' : '255,255,255'},${0.008 + r() * 0.012})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.lineCap = 'round';
  for (let i = 0; i < 900; i++) {              // fibres
    const x = r() * W, y = r() * H, a = r() * Math.PI * 2, l = 6 + r() * 26;
    g.strokeStyle = `rgba(90,80,70,${0.015 + r() * 0.03})`; g.lineWidth = 0.6 + r() * 0.8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * l * .6, y + Math.sin(a + 0.5) * l * .6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(60,50,40,${0.03 + r() * 0.07})`; g.fillRect(r() * W, r() * H, r() * 1.6 + .4, r() * 1.6 + .4); }
  return c;
}
function makeGrain(seed) {
  const w = 540, h = 960, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), d = g.createImageData(w, h), r = rng(seed);
  for (let i = 0; i < w * h; i++) { const v = 128 + (r() - .5) * 90; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
}

// draw an element centred at (x,y) with its longest side = size, plus hand-made "boil" on 2s
function drawEl(name, x, y, size, rot, alpha, f, id, sx = 1, sy = 1) {
  const im = IMG[name]; if (!im || alpha <= 0 || size <= 0) return;
  const k = size / Math.max(im.width, im.height), w = im.width * k, h = im.height * k;
  const b = Math.floor(f / 2), r = rng(b * 131 + id * 977);
  const jx = (r() - .5) * 2.4, jy = (r() - .5) * 2.4, jr = (r() - .5) * 0.009;
  X.save(); X.globalAlpha = alpha; X.translate(x + jx, y + jy); X.rotate(rot + jr); X.scale(sx, sy);
  X.drawImage(im, -w / 2, -h / 2, w, h); X.restore();
}

// ---------- the swirl ----------
// rate 1 until 9 s, then slows to a stop by 13 s; tau is its integral (time for the orbit).
// orbit time: full speed while they arrive, then they slow down and turn gently together
function tau(t) { if (t < 2) return t; if (t < 5) { const u = t - 2; return 2 + u - 0.7 * u * u / 6; } return 3.95 + 0.3 * (t - 5); }

const VARIANT = 'C';
// Where each idea comes to rest, per layout option. off: true = it flies out of frame.
const LAYOUTS = {
  A: { // "frame": ideas rest around the edges, the peony grows in the middle
    swoosh: { x: 560, y: 1790, s: 560, r: 0.04 }, cosmos: { x: 900, y: 1010, s: 230, r: 0.15 },
    monstera: { x: 900, y: 1620, s: 320, r: 0.25 }, butterfly: { x: 210, y: 1180, s: 220, r: -0.2 },
    palm: { x: 190, y: 1600, s: 400, r: -0.15 },
    peony: { x: 520, y: 1720, h: 600 }, perch: { x: 900, y: 1420 },
  },
  B: { // "garden": ideas land along the bottom like a small garden
    swoosh: { x: 540, y: 1850, s: 700, r: 0.0 }, cosmos: { x: 790, y: 1690, s: 250, r: 0.1 },
    monstera: { x: 960, y: 1640, s: 330, r: 0.18 }, butterfly: { x: 330, y: 1250, s: 210, r: -0.1, hover: true },
    palm: { x: 150, y: 1610, s: 430, r: -0.08 },
    peony: { x: 450, y: 1800, h: 640 }, perch: { x: 900, y: 1250 },
  },
  C: { // "one bloom": the other ideas fly off, one flower grows, the butterfly stays
    swoosh: { x: -700, y: 1500, s: 440, r: 0, off: true }, cosmos: { x: 1700, y: 1900, s: 300, r: 0, off: true },
    monstera: { x: 1700, y: 700, s: 300, r: 0, off: true }, butterfly: { x: 300, y: 1230, s: 220, r: -0.15, hover: true },
    palm: { x: -600, y: 2100, s: 300, r: 0, off: true },
    peony: { x: 500, y: 1840, h: 780 }, perch: { x: 900, y: 1040 },
  },
};
const LAY = LAYOUTS[VARIANT];
const SW = [ // name, base size, orbit radius, entry point
  { n: 'swoosh',    s: 460, r: 330, from: [-900, 620] },
  { n: 'cosmos',    s: 420, r: 250, from: [1500, 1300] },
  { n: 'monstera',  s: 390, r: 360, from: [-500, 300] },
  { n: 'butterfly', s: 380, r: 300, from: [1600, 500] },
  { n: 'palm',      s: 430, r: 210, from: [-600, 1700] },
];

function orbitPos(i, t) {
  const e = SW[i], th0 = i * Math.PI * 2 / SW.length, ta = tau(t);
  const grow = lerp(0.72, 0.82, easeInOut(prog(t, 1.5, 6)));
  const th = th0 + ta * 0.95 * (1 + 0.12 * Math.sin(i * 1.7));
  const rr = e.r * grow * (1 + 0.1 * Math.sin(ta * 1.3 + i * 2.1));
  return { x: CX + Math.cos(th) * rr, y: CY + 50 + Math.sin(th) * rr * 0.76, th };
}
function slotPos(i) { return LAY[SW[i].n]; }

function swirlState(i, t) {
  const e = SW[i], enterA = 0.1 + i * 0.22, enterB = enterA + 1.1;
  const op = orbitPos(i, Math.max(t, enterB));
  // entry from off-screen
  let x, y;
  if (t < enterB) { const p = easeOut(prog(t, enterA, enterB)); x = lerp(e.from[0], op.x, p); y = lerp(e.from[1], op.y, p); const o2 = orbitPos(i, t); x = lerp(x, o2.x, p * p); y = lerp(y, o2.y, p * p); }
  else { x = op.x; y = op.y; }
  const ta = tau(t);
  let size = e.s * lerp(0.8, 1.3, easeInOut(prog(t, 1.5, 6))) * (1 + 0.06 * Math.sin(ta * 2.1 + i));
  let rot = Math.sin(ta * 0.8 + i * 1.3) * 0.5 + (i % 2 ? 1 : -1) * ta * 0.25;
  // settle into the wreath
  const dw = T.depart[e.n], sl = slotPos(i);
  const sp = (sl.off ? easeIn : easeInOut)(prog(t, dw[0], dw[1]));
  if (sp > 0) {
    const s = slotPos(i);
    x = lerp(x, s.x, sp); y = lerp(y, s.y, sp); size = lerp(size, s.s, sp);
    rot = lerp(rot % (Math.PI * 2), s.r, sp);
    if (s.hover && t > T.settle[1]) { const u = t - T.settle[1], k = easeInOut(clamp(u / 1.5)); x += k * 170 * Math.sin(u * 0.55); y += k * 90 * Math.sin(u * 1.1); }
  }
  if (t > T.settle[1]) { size *= 1 + 0.018 * Math.sin(t * 1.6 + i); rot += 0.025 * Math.sin(t * 1.1 + i * 2); }
  const alpha = t < enterA ? 0 : 1;
  return { x, y, size, rot, alpha };
}

// ---------- text ----------
function wrap(words, font, maxW) {
  X.font = font; const lines = []; let cur = [];
  for (const w of words) { const test = [...cur, w].join(' '); if (X.measureText(test).width > maxW && cur.length) { lines.push(cur); cur = [w]; } else cur.push(w); }
  if (cur.length) lines.push(cur); return lines;
}
const STY = {
  big: n => ({ font: `700 ${n > 5 ? 76 : 86}px Playfair`, size: n > 5 ? 76 : 86, lh: 1.08, gapB: 26 }),
  small: () => ({ font: '400 50px Playfair', size: 50, lh: 1.22, gapB: 20 }),
  title: () => ({ font: '700 40px Playfair', size: 40, lh: 1.3, gapB: 0 }),
};
function drawLine(L, t) {
  const [a, b] = L.t; if (t < a - 0.01 || t > b) return;
  const out = 1 - easeIn(prog(t, b - 0.45, b));
  let y = TEXT_Y;
  X.save(); X.textBaseline = 'alphabetic';
  for (const it of L.items) {
    const st = STY[it.k](it.text.split(' ').length), words = it.text.split(' ');
    const lines = wrap(words, st.font, TEXT_W), t0 = a + (it.d || 0);
    let k = 0;
    for (const ln of lines) {
      y += st.size; let x = TEXT_X + 34;
      for (const w of ln) {
        const p = easeOut(prog(t, t0 + k * 0.06, t0 + k * 0.06 + 0.45));
        X.font = st.font; X.globalAlpha = p * out;
        const key = w.replace(/[^A-Za-z]/g, '');
        X.fillStyle = it.k === 'title' ? '#555' : (it.pink && key === it.pink) ? C_PINK : C_INK;
        X.fillText(w, x, y + (1 - p) * 22 - (1 - out) * 20);
        x += X.measureText(w + ' ').width; k++;
      }
      y += st.size * (st.lh - 1);
    }
    y += (it.gap ?? st.gapB) + st.size * 0.2;
  }
  const bp = easeOut(prog(t, a, a + 0.5)) * out;
  X.globalAlpha = 1; X.fillStyle = C_PINK;
  X.fillRect(TEXT_X, TEXT_Y + 8, 10, (y - TEXT_Y - 20) * bp);
  X.restore();
}

// ---------- scene pieces ----------
function drawEnso(t, f) {
  const p = easeInOut(prog(t, T.ensoDraw[0], T.ensoDraw[1])); if (p <= 0) return;
  const im = IMG.enso, size = 2 * R + 70;
  const a0 = -Math.PI * 0.62, a1 = a0 + p * Math.PI * 2.02;
  X.save();
  X.beginPath(); X.moveTo(CX, CY); X.arc(CX, CY, size, a0, a1); X.closePath(); X.clip();
  const breathe = t > T.ensoDraw[1] ? 1 + 0.008 * Math.sin(t * 1.4) : 1;
  drawEl('enso', CX, CY, size * breathe, 0, 1, f, 99);
  X.restore();
}

function drawGround(t, f) {
  // mist: the cloud drifts slowly along the bottom, grey like diluted ink
  const mp = prog(t, T.mist[0], T.mist[1]);
  if (mp > 0) { const a = Math.min(1, prog(t, T.mist[0], T.mist[0] + 1.5)) * 0.35; drawEl('cloud', lerp(-420, 1400, mp), 1870, 640, 0, a * 0.55, f, 50); }
  const p = easeOut(prog(t, T.mountain[0], T.mountain[1]));
  if (p > 0) drawEl('mountain', CX + 30, lerp(2250, 1805, p), 700, 0, Math.min(1, p * 2), f, 51);
}

let PEONY_BUF = null;
function drawPeony(t, f) {
  const p = prog(t, T.peony[0], T.peony[1]); if (p <= 0) return;
  const im = IMG.peony, h = LAY.peony.h, w = im.width * h / im.height, baseY = LAY.peony.y;
  const grow = easeOut(p), sway = 0.03 * Math.sin(t * 1.3) * (0.4 + 0.6 * p);
  if (!PEONY_BUF) { PEONY_BUF = document.createElement('canvas'); PEONY_BUF.width = Math.ceil(w) + 40; PEONY_BUF.height = Math.ceil(h) + 40; }
  const ob = PEONY_BUF, og = ob.getContext('2d');
  og.setTransform(1, 0, 0, 1, 0, 0); og.globalCompositeOperation = 'source-over'; og.clearRect(0, 0, ob.width, ob.height);
  const b = Math.floor(f / 2), r = rng(b * 17 + 5);
  og.drawImage(im, 20 + (r() - .5) * 2, 20 + (r() - .5) * 2, w, h);
  // soft-edged reveal from the stem upwards, like ink soaking up the paper
  const edge = 20 + h - lerp(-45, h + 45, grow);
  const g = og.createLinearGradient(0, edge + 45, 0, edge - 45);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  og.globalCompositeOperation = 'destination-in'; og.fillStyle = g; og.fillRect(0, 0, ob.width, ob.height);
  og.globalCompositeOperation = 'source-over';
  X.save(); X.translate(LAY.peony.x, baseY); X.rotate(sway);
  const sc = lerp(0.85, 1, grow); X.scale(sc, sc);
  X.drawImage(ob, -ob.width / 2, -ob.height + 20);
  X.restore();
}

// bird perch on the ensō, upper right
const PERCH = LAY.perch;
const BIRD_H = 270;
function birdFrame(t) {
  // bird image is drawn with its centre offset so its feet sit at the perch
  const footOff = { x: 0.045 * BIRD_H, y: -0.16 * BIRD_H };
  let x = PERCH.x + footOff.x, y = PERCH.y + footOff.y, rot = 0, sx = 1, sy = 1, alpha = 1;
  if (t < T.birdIn[0]) return null;
  if (t < T.birdIn[1]) {
    const p = prog(t, T.birdIn[0], T.birdIn[1]), e = easeOut(p);
    const s = { x: 1250, y: 330 }, c = { x: 1050, y: 380 };
    x = (1 - e) * (1 - e) * s.x + 2 * (1 - e) * e * c.x + e * e * x; y = (1 - e) * (1 - e) * s.y + 2 * (1 - e) * e * c.y + e * e * y;
    rot = -0.35 * (1 - e); const flap = Math.sin(t * 2 * Math.PI * 7) * (1 - e); sy = 1 + 0.12 * flap; sx = 1 - 0.05 * flap;
  } else if (t < T.birdOut[0]) {
    const u = t - T.birdIn[1]; const land = Math.exp(-u * 7) * Math.sin(u * 22);
    sy = 1 - 0.08 * land; sx = 1 + 0.05 * land; rot = 0.05 * Math.sin(u * 3.2) * Math.min(1, u * 2);
  } else {
    const p = prog(t, T.birdOut[0], T.birdOut[1]), e = easeIn(p);
    const s = { x, y }, c = { x: x + 40, y: y - 260 }, d = { x: 1350, y: 150 };
    x = (1 - e) * (1 - e) * s.x + 2 * (1 - e) * e * c.x + e * e * d.x; y = (1 - e) * (1 - e) * s.y + 2 * (1 - e) * e * c.y + e * e * d.y;
    const crouch = Math.exp(-((t - T.birdOut[0]) * 9)) ; sy = 1 - 0.1 * crouch;
    rot = -0.25 * Math.min(1, p * 3); const flap = Math.sin((t - T.birdOut[0]) * 2 * Math.PI * 7) * Math.min(1, p * 5); sy *= 1 + 0.13 * flap; sx = 1 - 0.05 * flap;
  }
  return { x, y, rot, sx, sy, alpha };
}
function drawBirdAndBranch(t, f) {
  const bp = easeOut(prog(t, T.branch[0], T.branch[1]));
  const k = BIRD_H / IMG.birdonly.height, w = IMG.birdonly.width * k;
  const base = { x: PERCH.x + 0.045 * BIRD_H, y: PERCH.y - 0.16 * BIRD_H };
  if (bp > 0) { // branch paints in from left to right under the perch
    X.save(); X.beginPath(); X.rect(base.x - w / 2 - 20, 0, (w + 40) * bp, H); X.clip();
    drawEl('branch', base.x, base.y, BIRD_H * 1.0 * Math.max(IMG.branch.width, IMG.branch.height) / IMG.branch.height, 0, 1, f, 61);
    X.restore();
  }
  const b = birdFrame(t); if (!b) return;
  drawEl('birdonly', b.x, b.y, BIRD_H * Math.max(IMG.birdonly.width, IMG.birdonly.height) / IMG.birdonly.height, b.rot, b.alpha, f, 60, b.sx, b.sy);
}

// ---------- render ----------
function render(f) {
  const t = f / FPS;
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.filter = 'none';
  X.drawImage(PAPER, 0, 0);

  drawPeony(t, f);

  // swirl elements (the butterfly flies off with the bird at the end)
  for (let i = 0; i < SW.length; i++) {
    let s = swirlState(i, t);
    if (SW[i].n === 'butterfly' && t > T.flyAway[0]) {
      const p = prog(t, T.flyAway[0], T.flyAway[1]), e = easeIn(p);
      s = { ...s, x: lerp(s.x, 1300, e) + Math.sin(t * 9) * 14 * p, y: lerp(s.y, 420, e) };
      const flut = Math.sin(t * 2 * Math.PI * 5) * Math.min(1, p * 4);
      // motion trail while it is fast
      drawEl('butterfly', s.x, s.y, s.size, s.rot - 0.3 * p, 1, f, 200 + i, 1 - 0.35 * Math.abs(flut), 1);
      continue;
    }
    // ghost trails while elements travel fast during entry and swirl
    const fastness = clamp(1 - prog(t, 6, 11)) * (t > 0.1 ? 1 : 0);
    if (fastness > 0.05 && t < 11) for (let g = 3; g >= 1; g--) {
      const s2 = swirlState(i, Math.max(0, t - g * 0.045));
      drawEl(SW[i].n, s2.x, s2.y, s2.size, s2.rot, s2.alpha * 0.1 * fastness, f, 100 + i);
    }
    drawEl(SW[i].n, s.x, s.y, s.size, s.rot, s.alpha, f, i);
  }

  drawBirdAndBranch(t, f);
  for (const L of T.lines) drawLine(L, t);

  // grain
  X.globalCompositeOperation = 'multiply'; X.globalAlpha = 0.035;
  X.drawImage(GRAIN[f % 4], 0, 0, W, H);
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
}
window.render = render; window.FPS = FPS; window.NF = NF;

(async () => {
  const fonts = [400, 700, 900].map(w => new FontFace('Playfair', `url(fonts/Playfair-${w}.woff2)`, { weight: String(w) }));
  for (const ft of fonts) { await ft.load(); document.fonts.add(ft); }
  for (const n of NAMES) IMG[n] = await loadImg(n);
  PAPER = makePaper(); for (let i = 0; i < 4; i++) GRAIN.push(makeGrain(11 + i));
  window.READY = true;
  if (!location.search.includes('render')) { const t0 = performance.now(); const loop = () => { render(Math.floor((performance.now() - t0) / 1000 * FPS) % NF); requestAnimationFrame(loop); }; loop(); }
})();
</script></body></html>
